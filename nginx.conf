# Static hosting for the ChainBeat production build (used by the Dockerfile; also fine as a standalone vhost).
# NOT exercised in the environment this project was built in — test it with your own host before relying on it.
server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Security headers. They are declared once at server level on purpose: an `add_header` inside a `location`
  # REPLACES the inherited ones in nginx, so the location blocks below use `expires` (which does not) for caching.
  # The CSP matches docs/SECURITY.md. 'unsafe-inline' for styles: components set inline `style` attributes and a
  # Radix dependency injects a <style> element at runtime. `data:` for fonts: Vite inlines the smallest font
  # subsets into the CSS as data URIs.
  # The four https://accounts.google.com/gsi/ entries are the endpoints Google documents for "Sign in with Google"
  # (Google Identity Services): its script, its button iframe, its requests and its stylesheet. They are used only on
  # /login and /register AFTER a Google client ID has been configured (docs/AUTH.md); without one nothing from Google
  # is ever requested. Delete them if you do not want that button at all.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  # Hashed build output never changes under the same name.
  # (`^~` makes this prefix win over the regex location below, which would otherwise match /assets/*.js too.)
  location ^~ /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # Fixed-name files that are not content-hashed (favicon, theme bootstrap script).
  location ~* \.(?:svg|js)$ {
    expires 1h;
    try_files $uri =404;
  }

  # Single-page-app fallback: any other path is a client-side route, and index.html must never be cached stale.
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
